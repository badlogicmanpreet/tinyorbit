[project]
name = "tinyorbit"
version = "0.1.0"
description = "tinyorbit: a small terminal coding agent, built chapter-by-chapter alongside the book."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
]

[project.scripts]
tinyorbit = "main:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyorbit"]
