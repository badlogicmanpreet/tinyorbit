[project]
name = "tinyorbit"
version = "0.1.0"
description = "A small terminal coding agent in Python, with its own agent loop."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "badlogicmanpreet" }]
keywords = ["agent", "coding-agent", "llm", "anthropic", "claude", "cli", "swe-bench"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Utilities",
]
# The core carries no third-party runtime dependency: the agent loop, tool
# system, permissions, memory, MCP client, and provider abstraction are pure
# stdlib. Each model dialect is an optional extra that pulls in only its own
# transport, so a build works with any model without dragging in the others.
dependencies = []

[project.optional-dependencies]
# The Anthropic-dialect provider (the reference dialect). Install with
# `tinyorbit[anthropic]` to talk to Claude; imported lazily on first use.
anthropic = ["anthropic>=1.0"]
# The OpenAI-dialect provider. Install with `tinyorbit[openai]` to reach any
# OpenAI-compatible model or gateway.
openai = ["openai>=1.0"]

[project.urls]
Homepage = "https://github.com/badlogicmanpreet/tinyorbit"
Repository = "https://github.com/badlogicmanpreet/tinyorbit"
Issues = "https://github.com/badlogicmanpreet/tinyorbit/issues"
Changelog = "https://github.com/badlogicmanpreet/tinyorbit/blob/main/CHANGELOG.md"

[project.scripts]
tinyorbit = "main:main"

[dependency-groups]
# Dev installs the anthropic dialect so the default model works out of the box;
# the openai transport stays opt-in and its tests importorskip.
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9", "anthropic>=1.0"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness and import hygiene only. The opinionated style rules are left off
# on purpose: this codebase uses deliberate alignment and explanatory comments
# that a formatter would flatten.
select = ["E4", "E7", "E9", "F", "I", "B", "W"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tinyorbit"]
